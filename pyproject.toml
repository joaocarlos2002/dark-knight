[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dark-knight-qa"
version = "0.1.0"
description = "Terminal-native, evidence-driven AI quality engineering workbench."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Dark Knight QA contributors" },
]
dependencies = [
    "typer>=0.16,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[project.scripts]
qa-workbench = "qa_workbench.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = ["-q"]
testpaths = ["tests"]

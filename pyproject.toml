[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dark-knight-qa"
version = "0.2.0"
description = "Terminal-native, evidence-driven AI quality engineering workbench."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Dark Knight QA contributors" },
]
dependencies = [
    "pillow>=11.0,<13.0",
    "playwright>=1.49,<2.0",
    "pydantic>=2.7,<3.0",
    "pyyaml>=6.0,<7.0",
    "textual>=8.2,<9.0",
    "typer>=0.16,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.11,<1.0",
]

[project.scripts]
batman = "qa_workbench.main:app"
qa-workbench = "qa_workbench.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = ["-q"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

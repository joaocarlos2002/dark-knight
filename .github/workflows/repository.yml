name: Repository checks

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check for accidental secrets and generated files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env|.*\.(pem|key|p12|pfx))$'; then
            echo "Tracked secret-like file detected."
            exit 1
          fi
          if git ls-files | grep -E '(^|/)(__pycache__|\.pytest_cache|dist|build)/'; then
            echo "Tracked generated directory detected."
            exit 1
          fi

      - name: Validate required community files
        shell: bash
        run: |
          set -euo pipefail
          test -f CONTRIBUTING.md
          test -f ARCHITECTURE.md
          test -f CODE_OF_CONDUCT.md
          test -f SECURITY.md
          test -f SUPPORT.md
          test -f .github/PULL_REQUEST_TEMPLATE.md
          test -f .github/ISSUE_TEMPLATE/config.yml

  python-quality:
    name: Python quality (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest

      - name: Check lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

  # The suite above runs on Linux. These run the same tests where users run the
  # application too. The Linux job names above are unchanged on purpose, so
  # branch protection that requires them keeps working.
  cross-platform-tests:
    name: Tests on ${{ matrix.os }} (${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.12", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest

  # What a user installs is the wheel, not the repository. Build it, install only
  # the wheel into a new environment outside the checkout, and use the program.
  clean-install:
    name: Clean install on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Build the wheel
        shell: bash
        run: |
          rm -rf build dist
          uv build --wheel

      - name: Install only the wheel into a new environment
        shell: bash
        run: |
          uv venv "$RUNNER_TEMP/clean-env"
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "CLEAN_PYTHON=$RUNNER_TEMP/clean-env/Scripts/python.exe" >> "$GITHUB_ENV"
            echo "CLEAN_BIN=$RUNNER_TEMP/clean-env/Scripts" >> "$GITHUB_ENV"
          else
            echo "CLEAN_PYTHON=$RUNNER_TEMP/clean-env/bin/python" >> "$GITHUB_ENV"
            echo "CLEAN_BIN=$RUNNER_TEMP/clean-env/bin" >> "$GITHUB_ENV"
          fi
          uv pip install --python "$RUNNER_TEMP/clean-env" dist/*.whl

      - name: The batman command exists and answers
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          "$CLEAN_BIN/batman" --version
          "$CLEAN_BIN/qa-workbench" --version

      - name: Smoke test the installed program and its TUI
        shell: bash
        working-directory: ${{ runner.temp }}
        run: '"$CLEAN_PYTHON" "$GITHUB_WORKSPACE/.github/scripts/smoke_installed.py"'

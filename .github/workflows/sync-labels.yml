name: Sync labels

on:
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  sync:
    name: Synchronize repository labels
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Synchronize labels
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const source = fs.readFileSync(".github/labels.yml", "utf8");
            const labels = [];
            let current;

            for (const line of source.split(/\r?\n/)) {
              const entry = line.match(/^- name: "(.+)"$/);
              if (entry) {
                if (current) labels.push(current);
                current = { name: entry[1] };
                continue;
              }

              const property = line.match(/^\s+(color|description): "(.+)"$/);
              if (property && current) current[property[1]] = property[2];
            }
            if (current) labels.push(current);

            if (labels.length === 0) {
              throw new Error("No labels found in .github/labels.yml");
            }

            const { owner, repo } = context.repo;

            for (const label of labels) {
              try {
                await github.rest.issues.updateLabel({
                  owner,
                  repo,
                  name: label.name,
                  color: label.color,
                  description: label.description,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: label.name,
                  color: label.color,
                  description: label.description,
                });
              }
            }
